services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-central_ajuda_ciclo}
      MYSQL_USER: ${MYSQL_USER:-central_ajuda_ciclo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-central_ajuda_ciclo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_SECURE_SSL_REDIRECT: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-central_ajuda_ciclo}
      MYSQL_USER: ${MYSQL_USER:-central_ajuda_ciclo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-central_ajuda_ciclo}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-aluno.demo@central-ajuda-ciclo.local}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-aluno12345}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-atendente.demo@central-ajuda-ciclo.local}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-atendente12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_DEMO_MODE: "false"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  db_data:
  static_data:
  media_data:
